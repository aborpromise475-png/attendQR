# Render Deployment Blueprint for AttendIQ
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: attendiq
    runtime: node
    plan: free
    rootDir: AttendIQ/backend
    buildCommand: npm install
    startCommand: npm start
    autoDeployTrigger: commit
    envVars:
      - key: ATTENDIQ_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: attendiq-db
          property: connectionString

databases:
  - name: attendiq-db
    plan: free
    databaseName: attendiq
    user: attendiq_user