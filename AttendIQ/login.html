<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AttendIQ – Login</title>
  <link rel="stylesheet" href="Css/style.css" />
</head>
<body class="auth-page">

  <div class="auth-card">

    <div class="logo">
      <div class="logo-icon">QR</div>
      <h1>AttendIQ</h1>
      <p>Smart Attendance Management</p>
    </div>

    <div class="role-toggle">
      <button class="active" onclick="setRole('student', this)">Student</button>
      <button onclick="setRole('lecturer', this)">Lecturer</button>
    </div>

    <div class="error-box" id="error">Invalid credentials. Please try again.</div>

    <div class="form-group">
      <label>Email Address</label>
      <input type="email" id="email" placeholder="Enter your email" />
    </div>

    <div class="form-group">
      <label>Password</label>
      <div class="password-field">
        <input type="password" id="password" placeholder="Enter your password" />
        <button
          type="button"
          class="password-toggle"
          aria-label="Show password"
          onclick="togglePassword('password', this)"
        >
          <span class="eye-icon" aria-hidden="true"></span>
        </button>
      </div>
    </div>

    <button class="btn-primary" onclick="handleLogin()">Sign In</button>

    <div class="demo-box">
      <p id="demo-label">Demo – Student</p>
      <span id="demo-creds">student@ums.edu.gh / student123</span>
      <button class="autofill-btn" onclick="autofill()">Auto-fill credentials</button>
    </div>

    <div class="auth-footer">
      No account? <a href="register.html">Register here</a>
    </div>

  </div>

  <script src="Js/auth.js"></script>

</body>
</html>
