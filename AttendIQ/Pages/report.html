<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>AttendIQ - Reports</title>
	<link rel="stylesheet" href="../Css/style.css" />
	<link rel="stylesheet" href="../Css/dashboard.css" />
</head>
<body class="dashboard-page">
	<div class="student-layout">
		<aside class="student-sidebar">
			<div class="student-brand">
				<div class="logo-icon">QR</div>
				<h2>AttendIQ</h2>
			</div>
			<nav class="student-nav">
				<button onclick="window.location.href='lec-dashboard.html'">Overview</button>
				<button onclick="window.location.href='generate-qr.html'">Generate QR</button>
				<button onclick="window.location.href='scan-qr.html'">Scan Attendance</button>
				<button class="active" onclick="window.location.href='report.html'">Reports</button>
			</nav>
			<button class="btn-secondary sidebar-logout" onclick="window.location.href='../login.html'">Logout</button>
		</aside>

		<main class="student-main dashboard-shell">
			<header class="student-topbar">
				<div>
					<button class="mobile-nav-toggle" onclick="toggleMobileNav()">Menu</button>
					<h1>Attendance Reports</h1>
				</div>
				<p class="page-note">Filter by course, student, status, or date range and export the visible rows.</p>
			</header>

			<section class="summary-grid">
				<article class="summary-card"><p>Total records</p><strong id="reportTotalCount">0</strong></article>
				<article class="summary-card"><p>Present</p><strong id="reportPresentCount">0</strong></article>
				<article class="summary-card"><p>Absent</p><strong id="reportAbsentCount">0</strong></article>
				<article class="summary-card"><p>Unique students</p><strong id="reportStudentCount">0</strong></article>
			</section>

			<article class="panel">
				<div class="panel-head">
					<h3>Filters</h3>
				</div>
				<div class="filter-row">
					<div class="form-group"><label for="reportCourseFilter">Course</label><select id="reportCourseFilter" onchange="renderReportTable()"><option value="all">All courses</option></select></div>
					<div class="form-group"><label for="reportStudentFilter">Student</label><input id="reportStudentFilter" type="text" placeholder="Search student" oninput="renderReportTable()" /></div>
					<div class="form-group"><label for="reportStatusFilter">Status</label><select id="reportStatusFilter" onchange="renderReportTable()"><option value="all">All status</option><option value="Present">Present</option><option value="Absent">Absent</option></select></div>
					<div class="form-group"><label for="reportStartDate">From</label><input id="reportStartDate" type="date" onchange="renderReportTable()" /></div>
					<div class="form-group"><label for="reportEndDate">To</label><input id="reportEndDate" type="date" onchange="renderReportTable()" /></div>
				</div>
				<div class="dashboard-links control-grid">
					<button class="btn-primary" onclick="exportReportCsv()">Export CSV</button>
					<button class="btn-secondary" onclick="resetReportFilters()">Reset filters</button>
				</div>
			</article>

			<article class="panel">
				<div class="panel-head">
					<h3>Report Table</h3>
				</div>
				<div class="table-wrap">
					<table>
						<thead>
							<tr><th>Date</th><th>Course</th><th>Student</th><th>Session</th><th>Status</th><th>Marked at</th></tr>
						</thead>
						<tbody id="reportTableBody"></tbody>
					</table>
				</div>
			</article>
		</main>
	</div>

	<script src="../Js/report.js"></script>
</body>
</html>
